name: CI
on: [push, pull_request]
permissions: { contents: read }
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres: { image: postgres:16-alpine, env: { POSTGRES_DB: ledgerflow_test, POSTGRES_USER: ledgerflow, POSTGRES_PASSWORD: ledgerflow-local-only }, ports: ["5432:5432"], options: "--health-cmd pg_isready --health-interval 5s --health-timeout 3s --health-retries 10" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21", cache: maven }
      - name: Build and test (real PostgreSQL service container)
        env: { TEST_DB_URL: "jdbc:postgresql://localhost:5432/ledgerflow_test" }
        run: ./mvnw -B verify
      - name: Dependency vulnerability scan (report only)
        run: ./mvnw -B org.owasp:dependency-check-maven:check -DskipTests || true
